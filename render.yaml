services:
  - type: web
    name: vani-voice-rag
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: QDRANT_COLLECTION
        value: schemes_small
      - key: DENSE_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: AWS_REGION
        value: eu-north-1
      - key: BEDROCK_LLM_MODEL
        value: eu.amazon.nova-lite-v1:0
      - key: BEDROCK_S3_BUCKET
        value: government-scheme
      - key: QDRANT_CLOUD_URL
        sync: false
      - key: QDRANT_CLOUD_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
